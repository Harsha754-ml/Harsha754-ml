<svg
  width="1200"
  height="1990"
  viewBox="0 0 1200 1990"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Harsha — Developer Profile</title>
  <desc id="desc">
    A neo-brutalist developer profile: identity, active builds,
    the build/break/rebuild loop, and open questions.
  </desc>

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#111111" stroke-opacity=".07" stroke-width="1"/>
    </pattern>

    <style>
      .heavy { font-family: "Archivo Black","Arial Black","Helvetica Neue",Impact,sans-serif; font-weight: 900; }
      .sans  { font-family: "Inter","Segoe UI",Helvetica,Arial,sans-serif; }
      .mono  { font-family: "JetBrains Mono","SFMono-Regular",Menlo,Consolas,monospace; }

      .wobble { animation: wobble 3s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
      @keyframes wobble { from { transform: rotate(-12deg); } to { transform: rotate(-6deg); } }

      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
      }
    </style>
  </defs>

  <!-- ================= BACKGROUND ================= -->
  <rect width="1200" height="1990" fill="#F3EFE4"/>
  <rect width="1200" height="1990" fill="url(#grid)"/>

  <!-- ================= TOP BAR ================= -->
  <rect width="1200" height="64" fill="#111111"/>
  <text x="64" y="40" font-size="18" font-weight="700" class="mono" fill="#FFFFFF">harsha<tspan fill="#C8F43A">@katta</tspan></text>
  <text x="600" y="40" text-anchor="middle" font-size="13" letter-spacing="2" class="mono" fill="#8B8B8B">★ BUILD ★ BREAK ★ UNDERSTAND ★</text>
  <text x="1136" y="40" text-anchor="end" font-size="15" font-weight="700" class="mono" fill="#C8F43A">kattaharsha.dev</text>

  <!-- ================= HERO ================= -->
  <text x="64" y="206" font-size="100" class="heavy" fill="#111111" textLength="900" lengthAdjust="spacingAndGlyphs">I BUILD THINGS</text>

  <!-- highlighted BREAK -->
  <rect x="244" y="236" width="468" height="100" fill="#111111"/>
  <rect x="236" y="228" width="468" height="100" fill="#FF5C9D" stroke="#111111" stroke-width="4"/>
  <text x="64" y="316" font-size="100" class="heavy" fill="#111111" textLength="150" lengthAdjust="spacingAndGlyphs">TO</text>
  <text x="252" y="316" font-size="100" class="heavy" fill="#111111" textLength="436" lengthAdjust="spacingAndGlyphs">BREAK</text>
  <text x="730" y="316" font-size="100" class="heavy" fill="#111111" textLength="400" lengthAdjust="spacingAndGlyphs">THEM.</text>

  <!-- sticker -->
  <g class="wobble">
    <circle cx="1076" cy="140" r="60" fill="#111111" transform="translate(5 5)"/>
    <circle cx="1076" cy="140" r="60" fill="#C8F43A" stroke="#111111" stroke-width="4"/>
    <text x="1076" y="128" text-anchor="middle" font-size="15" class="mono" font-weight="700" fill="#111111">FINAL</text>
    <text x="1076" y="148" text-anchor="middle" font-size="15" class="mono" font-weight="700" fill="#111111">YEAR</text>
    <text x="1076" y="168" text-anchor="middle" font-size="15" class="mono" font-weight="700" fill="#111111">AIML</text>
  </g>

  <!-- identity -->
  <text x="64" y="388" font-size="18" class="mono" fill="#111111">katta harsha vardhan — final-year aiml undergrad, systems tinkerer</text>

  <!-- philosophy -->
  <rect x="64" y="416" width="10" height="106" fill="#111111"/>
  <text x="96" y="446" font-size="24" font-weight="800" class="sans" fill="#111111">not a student who codes.</text>
  <text x="96" y="480" font-size="19" class="sans" fill="#111111">a person who builds things to understand them,</text>
  <text x="96" y="508" font-size="19" class="sans" fill="#111111">then breaks them to understand them better.</text>

  <!-- tags -->
  <g class="mono" font-size="13" font-weight="700" letter-spacing="1">
    <rect x="68" y="558" width="180" height="36" fill="#111111"/>
    <rect x="64" y="554" width="180" height="36" fill="#FFD93D" stroke="#111111" stroke-width="3"/>
    <text x="154" y="577" text-anchor="middle" fill="#111111">AIML UNDERGRAD</text>

    <rect x="276" y="558" width="116" height="36" fill="#111111"/>
    <rect x="272" y="554" width="116" height="36" fill="#9DB4FF" stroke="#111111" stroke-width="3"/>
    <text x="330" y="577" text-anchor="middle" fill="#111111">BUILDER</text>

    <rect x="420" y="558" width="236" height="36" fill="#111111"/>
    <rect x="416" y="554" width="236" height="36" fill="#FF5C9D" stroke="#111111" stroke-width="3"/>
    <text x="534" y="577" text-anchor="middle" fill="#111111">EXPERIMENTAL SYSTEMS</text>
  </g>

  <!-- ================= SECTION 01: ACTIVE BUILDS ================= -->
  <rect x="64" y="650" width="56" height="40" fill="#111111"/>
  <text x="92" y="677" text-anchor="middle" font-size="20" font-weight="700" class="mono" fill="#C8F43A">01</text>
  <text x="140" y="684" font-size="44" class="heavy" fill="#111111">ACTIVE BUILDS</text>
  <text x="64" y="722" font-size="16" class="sans" fill="#3A3A3A">Small systems built to answer larger questions, not to pad a résumé.</text>

  <!-- TermNav (wide) -->
  <rect x="72" y="756" width="1072" height="120" fill="#111111"/>
  <rect x="64" y="748" width="1072" height="120" fill="#C8F43A" stroke="#111111" stroke-width="4"/>
  <text x="92" y="806" font-size="40" class="heavy" fill="#111111">TERMNAV</text>
  <rect x="982" y="768" width="126" height="32" fill="#111111"/>
  <text x="1045" y="789" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1" class="mono" fill="#C8F43A">SHIPPED</text>
  <text x="92" y="844" font-size="18" class="sans" fill="#111111">Keyboard-driven terminal navigation, published to npm — the first system that felt real.</text>

  <!-- Doclayer -->
  <rect x="72" y="906" width="524" height="150" fill="#111111"/>
  <rect x="64" y="898" width="524" height="150" fill="#FFD93D" stroke="#111111" stroke-width="4"/>
  <text x="92" y="950" font-size="32" class="heavy" fill="#111111">DOCLAYER</text>
  <rect x="470" y="916" width="96" height="30" fill="#111111"/>
  <text x="518" y="936" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1" class="mono" fill="#FFFFFF">ACTIVE</text>
  <text x="92" y="992" font-size="17" class="sans" fill="#111111">Word Automation System</text>

  <!-- MorphStudio -->
  <rect x="620" y="906" width="524" height="150" fill="#111111"/>
  <rect x="612" y="898" width="524" height="150" fill="#FF8FB7" stroke="#111111" stroke-width="4"/>
  <text x="640" y="950" font-size="32" class="heavy" fill="#111111">MORPHSTUDIO</text>
  <rect x="1018" y="916" width="96" height="30" fill="#111111"/>
  <text x="1066" y="936" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1" class="mono" fill="#FFFFFF">ACTIVE</text>
  <text x="640" y="992" font-size="17" class="sans" fill="#111111">Graphics and vector work that outgrew</text>
  <text x="640" y="1018" font-size="17" class="sans" fill="#111111">a weekend curiosity.</text>

  <!-- Nexis -->
  <rect x="72" y="1086" width="524" height="150" fill="#111111"/>
  <rect x="64" y="1078" width="524" height="150" fill="#9DB4FF" stroke="#111111" stroke-width="4"/>
  <text x="92" y="1130" font-size="32" class="heavy" fill="#111111">NEXIS</text>
  <rect x="470" y="1096" width="96" height="30" fill="#111111"/>
  <text x="518" y="1116" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1" class="mono" fill="#FFFFFF">WIP</text>
  <text x="92" y="1172" font-size="17" class="sans" fill="#111111">Distributed systems — because one</text>
  <text x="92" y="1198" font-size="17" class="sans" fill="#111111">machine was never enough.</text>

  <!-- Orbit -->
  <rect x="620" y="1086" width="524" height="150" fill="#111111"/>
  <rect x="612" y="1078" width="524" height="150" fill="#FFFFFF" stroke="#111111" stroke-width="4"/>
  <text x="640" y="1130" font-size="32" class="heavy" fill="#111111">ORBIT</text>
  <rect x="1002" y="1096" width="112" height="30" fill="#111111"/>
  <text x="1058" y="1116" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1" class="mono" fill="#FFFFFF">ONGOING</text>
  <text x="640" y="1172" font-size="17" class="sans" fill="#111111">An operating system from scratch — probably</text>
  <text x="640" y="1198" font-size="17" class="sans" fill="#111111">never finished, always instructive.</text>

  <!-- ================= SECTION 02: THE LOOP ================= -->
  <rect x="64" y="1300" width="56" height="40" fill="#111111"/>
  <text x="92" y="1327" text-anchor="middle" font-size="20" font-weight="700" class="mono" fill="#C8F43A">02</text>
  <text x="140" y="1334" font-size="44" class="heavy" fill="#111111">THE LOOP</text>
  <text x="64" y="1372" font-size="16" class="sans" fill="#3A3A3A">Five real stages, repeated until something works.</text>

  <!-- step 1 -->
  <rect x="72" y="1408" width="200" height="190" fill="#111111"/>
  <rect x="64" y="1400" width="200" height="190" fill="#FFFFFF" stroke="#111111" stroke-width="4"/>
  <text x="84" y="1462" font-size="52" class="heavy" fill="#111111">01</text>
  <text x="84" y="1508" font-size="18" font-weight="800" class="sans" fill="#111111">encounter</text>
  <text x="84" y="1532" font-size="18" font-weight="800" class="sans" fill="#111111">something</text>
  <text x="84" y="1556" font-size="18" font-weight="800" class="sans" fill="#111111">confusing</text>

  <!-- step 2 -->
  <rect x="290" y="1408" width="200" height="190" fill="#111111"/>
  <rect x="282" y="1400" width="200" height="190" fill="#FFD93D" stroke="#111111" stroke-width="4"/>
  <text x="302" y="1462" font-size="52" class="heavy" fill="#111111">02</text>
  <text x="302" y="1508" font-size="18" font-weight="800" class="sans" fill="#111111">build the</text>
  <text x="302" y="1532" font-size="18" font-weight="800" class="sans" fill="#111111">smallest</text>
  <text x="302" y="1556" font-size="18" font-weight="800" class="sans" fill="#111111">version</text>

  <!-- step 3 -->
  <rect x="508" y="1408" width="200" height="190" fill="#111111"/>
  <rect x="500" y="1400" width="200" height="190" fill="#FF5C9D" stroke="#111111" stroke-width="4"/>
  <text x="520" y="1462" font-size="52" class="heavy" fill="#111111">03</text>
  <text x="520" y="1508" font-size="18" font-weight="800" class="sans" fill="#111111">break it</text>
  <text x="520" y="1532" font-size="18" font-weight="800" class="sans" fill="#111111">on purpose</text>

  <!-- step 4 -->
  <rect x="726" y="1408" width="200" height="190" fill="#111111"/>
  <rect x="718" y="1400" width="200" height="190" fill="#9DB4FF" stroke="#111111" stroke-width="4"/>
  <text x="738" y="1462" font-size="52" class="heavy" fill="#111111">04</text>
  <text x="738" y="1508" font-size="18" font-weight="800" class="sans" fill="#111111">understand</text>
  <text x="738" y="1532" font-size="18" font-weight="800" class="sans" fill="#111111">the failure</text>

  <!-- step 5 -->
  <rect x="944" y="1408" width="200" height="190" fill="#111111"/>
  <rect x="936" y="1400" width="200" height="190" fill="#C8F43A" stroke="#111111" stroke-width="4"/>
  <text x="956" y="1462" font-size="52" class="heavy" fill="#111111">05</text>
  <text x="956" y="1508" font-size="18" font-weight="800" class="sans" fill="#111111">rebuild it</text>
  <text x="956" y="1532" font-size="18" font-weight="800" class="sans" fill="#111111">properly</text>

  <!-- loop back -->
  <path d="M1036 1606 V1632 H164 V1608" stroke="#111111" stroke-width="3" stroke-dasharray="8 6"/>
  <path d="M152 1616 L164 1604 L176 1616" stroke="#111111" stroke-width="3" stroke-linecap="square"/>
  <text x="600" y="1664" text-anchor="middle" font-size="14" font-weight="700" class="mono" fill="#111111">↻ loops back to 01 — next confusing thing</text>

  <!-- ================= SECTION 03: OPEN QUESTIONS ================= -->
  <rect x="64" y="1720" width="56" height="40" fill="#111111"/>
  <text x="92" y="1747" text-anchor="middle" font-size="20" font-weight="700" class="mono" fill="#C8F43A">03</text>
  <text x="140" y="1754" font-size="44" class="heavy" fill="#111111">OPEN QUESTIONS</text>

  <!-- note 1 -->
  <g transform="rotate(-1.5 234 1860)">
    <rect x="72" y="1798" width="341" height="132" fill="#111111"/>
    <rect x="64" y="1790" width="341" height="132" fill="#FFD93D" stroke="#111111" stroke-width="4"/>
    <rect x="84" y="1808" width="92" height="24" fill="#111111"/>
    <text x="130" y="1825" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1" class="mono" fill="#C8F43A">#001 OPEN</text>
    <text x="84" y="1868" font-size="18" font-weight="800" class="sans" fill="#111111">Where ML ends and</text>
    <text x="84" y="1894" font-size="18" font-weight="800" class="sans" fill="#111111">systems engineering begins.</text>
  </g>

  <!-- note 2 -->
  <g transform="rotate(1 599 1860)">
    <rect x="437" y="1798" width="341" height="132" fill="#111111"/>
    <rect x="429" y="1790" width="341" height="132" fill="#FF8FB7" stroke="#111111" stroke-width="4"/>
    <rect x="449" y="1808" width="92" height="24" fill="#111111"/>
    <text x="495" y="1825" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1" class="mono" fill="#C8F43A">#002 OPEN</text>
    <text x="449" y="1868" font-size="18" font-weight="800" class="sans" fill="#111111">How schedulers decide</text>
    <text x="449" y="1894" font-size="18" font-weight="800" class="sans" fill="#111111">what deserves to run next.</text>
  </g>

  <!-- note 3 -->
  <g transform="rotate(-1 964 1860)">
    <rect x="802" y="1798" width="341" height="132" fill="#111111"/>
    <rect x="794" y="1790" width="341" height="132" fill="#9DB4FF" stroke="#111111" stroke-width="4"/>
    <rect x="814" y="1808" width="92" height="24" fill="#111111"/>
    <text x="860" y="1825" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1" class="mono" fill="#C8F43A">#003 OPEN</text>
    <text x="814" y="1868" font-size="18" font-weight="800" class="sans" fill="#111111">Why some abstractions hold</text>
    <text x="814" y="1894" font-size="18" font-weight="800" class="sans" fill="#111111">while others leak immediately.</text>
  </g>

  <!-- ================= FOOTER ================= -->
  <rect y="1950" width="1200" height="40" fill="#111111"/>
  <text x="64" y="1975" font-size="12" letter-spacing="1" class="mono" fill="#8B8B8B">coursework gathers dust · experiments do not.</text>
  <text x="1136" y="1975" text-anchor="end" font-size="12" letter-spacing="1" font-weight="700" class="mono" fill="#C8F43A">build → break → understand</text>
</svg>
