<svg width="1200" height="1660" viewBox="0 0 1200 1660" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Harsha — Minimal Signature Banner</title>
  <desc id="desc">A minimal black banner with aurora gradients, subtle motion, and sharp typographic focus.</desc>

  <defs>
    <linearGradient id="bg" x1="600" y1="0" x2="600" y2="1660" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#040508"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>

    <radialGradient id="halo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 760) rotate(90) scale(700 640)">
      <stop offset="0" stop-color="#8CD9FF" stop-opacity="0.18"/>
      <stop offset="0.4" stop-color="#B89EFF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="line" x1="200" y1="990" x2="1000" y2="990" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="blur80" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="80"/>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .pulse { animation: pulse 6s ease-in-out infinite; transform-origin: 600px 760px; }
      .drift { animation: drift 18s ease-in-out infinite alternate; }
      .orbit { animation: orbit 16s linear infinite; transform-origin: 600px 760px; }
      .blink { animation: blink 4.2s ease-in-out infinite alternate; }
      @keyframes pulse { 0%,100% { opacity: .72; transform: scale(1); } 50% { opacity: 1; transform: scale(1.03); } }
      @keyframes drift { from { transform: translateY(-22px); opacity: .5; } to { transform: translateY(22px); opacity: .9; } }
      @keyframes orbit { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes blink { from { opacity: .35; } to { opacity: .9; } }
      @media (prefers-reduced-motion: reduce) {
        .pulse, .drift, .orbit, .blink { animation: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="1660" fill="url(#bg)"/>
  <rect width="1200" height="1660" fill="url(#halo)" class="pulse"/>

  <g class="drift" filter="url(#blur80)">
    <ellipse cx="380" cy="620" rx="210" ry="120" fill="#5FD4FF" fill-opacity="0.22"/>
    <ellipse cx="830" cy="930" rx="250" ry="130" fill="#C595FF" fill-opacity="0.18"/>
  </g>

  <g opacity="0.82">
    <circle cx="210" cy="260" r="2" fill="white" class="blink"/>
    <circle cx="1020" cy="300" r="1.4" fill="white" class="blink" style="animation-delay:-1.2s"/>
    <circle cx="950" cy="1360" r="1.6" fill="white" class="blink" style="animation-delay:-2.1s"/>
    <circle cx="250" cy="1280" r="1.3" fill="white" class="blink" style="animation-delay:-0.8s"/>
    <circle cx="610" cy="190" r="1.2" fill="white" class="blink" style="animation-delay:-2.8s"/>
  </g>

  <g filter="url(#softGlow)">
    <circle cx="600" cy="760" r="310" stroke="white" stroke-opacity="0.06"/>
    <circle cx="600" cy="760" r="248" stroke="white" stroke-opacity="0.12"/>
    <circle cx="600" cy="760" r="188" stroke="white" stroke-opacity="0.22"/>
    <g class="orbit">
      <circle cx="788" cy="760" r="5" fill="#ffffff"/>
      <circle cx="412" cy="760" r="3" fill="#9BD9FF" fill-opacity="0.85"/>
    </g>
  </g>

  <line x1="200" y1="990" x2="1000" y2="990" stroke="url(#line)" stroke-width="1.4"/>

  <g fill="white" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="600" y="865" font-size="154" font-weight="700" letter-spacing="24">HARSHA</text>
    <text x="600" y="942" font-size="28" font-weight="400" letter-spacing="8" opacity="0.82">BUILD · BREAK · BECOME</text>
    <text x="600" y="1070" font-size="19" font-weight="300" letter-spacing="5" opacity="0.68">minimal systems · maximal presence</text>
  </g>
</svg>
