<svg width="680" height="180" viewBox="0 0 680 180" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Harsha — field notes active</title>
  <desc id="desc">An animated dark blue technical field-notes banner with a glowing HUD, scanning line, and subtly animated title.</desc>
  <defs>
    <linearGradient id="background" x1="12" y1="0" x2="668" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1624"/>
      <stop offset="0.5" stop-color="#090E17"/>
      <stop offset="1" stop-color="#070B12"/>
    </linearGradient>
    <radialGradient id="blueBloom" cx="0" cy="0" r="1" gradientTransform="translate(534 82) rotate(141) scale(210 135)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2387FF" stop-opacity=".18"/>
      <stop offset="1" stop-color="#2387FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#58A6FF"/>
      <stop offset=".55" stop-color="#A5D6FF"/>
      <stop offset="1" stop-color="#58A6FF"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#58A6FF" stop-opacity="0"/>
      <stop offset=".45" stop-color="#79C0FF" stop-opacity=".03"/>
      <stop offset=".5" stop-color="#B6E3FF" stop-opacity=".44"/>
      <stop offset=".55" stop-color="#79C0FF" stop-opacity=".03"/>
      <stop offset="1" stop-color="#58A6FF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="microGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" stroke="#79C0FF" stroke-opacity=".045" stroke-width=".65"/>
      <circle cx="2" cy="2" r=".8" fill="#79C0FF" fill-opacity=".11"/>
    </pattern>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="titleShadow" x="-10%" y="-30%" width="130%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity=".65"/>
    </filter>
    <clipPath id="bannerClip"><rect width="680" height="180" rx="12"/></clipPath>
    <style>
      .scan { animation: sweep 5.8s cubic-bezier(.4,0,.2,1) infinite; }
      .orbit-a { transform-origin: 586px 91px; animation: orbit 16s linear infinite; }
      .orbit-b { transform-origin: 586px 91px; animation: orbit-reverse 10s linear infinite; }
      .pulse { transform-origin: 586px 91px; animation: pulse 2.7s ease-out infinite; }
      .pulse-delay { transform-origin: 586px 91px; animation: pulse 2.7s ease-out 1.35s infinite; }
      .eyebrow, .title, .subtitle, .rule { animation-fill-mode: both; }
      .eyebrow { animation: lift .65s cubic-bezier(.16,1,.3,1) .08s both; }
      .title { transform-origin: 34px 112px; animation: title-in .85s cubic-bezier(.16,1,.3,1) .18s both; }
      .subtitle { animation: lift .65s cubic-bezier(.16,1,.3,1) .36s both; }
      .rule { transform-origin: 0 0; animation: rule-in .8s cubic-bezier(.16,1,.3,1) .44s both; }
      .status-dot { animation: status 1.8s ease-in-out infinite; }
      .particle-1 { animation: float-one 7s ease-in-out infinite; }
      .particle-2 { animation: float-two 9s ease-in-out infinite; }
      .particle-3 { animation: float-one 6s ease-in-out 1.5s infinite reverse; }
      @keyframes sweep { 0%, 12% { transform: translateX(-760px); opacity: 0; } 20% { opacity: 1; } 75% { opacity: .85; } 88%, 100% { transform: translateX(760px); opacity: 0; } }
      @keyframes orbit { to { transform: rotate(360deg); } }
      @keyframes orbit-reverse { to { transform: rotate(-360deg); } }
      @keyframes pulse { 0% { transform: scale(.78); opacity: .42; } 78%, 100% { transform: scale(1.22); opacity: 0; } }
      @keyframes lift { from { transform: translateY(9px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
      @keyframes title-in { from { transform: translateY(12px) scale(.975); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }
      @keyframes rule-in { from { transform: scaleX(0); opacity: 0; } to { transform: scaleX(1); opacity: 1; } }
      @keyframes status { 0%,100% { opacity: .55; filter: brightness(.8); } 50% { opacity: 1; filter: brightness(1.5); } }
      @keyframes float-one { 0%,100% { transform: translate(0,0); opacity: .14; } 50% { transform: translate(12px,-8px); opacity: .46; } }
      @keyframes float-two { 0%,100% { transform: translate(0,0); opacity: .10; } 50% { transform: translate(-15px,8px); opacity: .32; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>
  <g clip-path="url(#bannerClip)">
    <rect width="680" height="180" fill="url(#background)"/>
    <rect width="680" height="180" fill="url(#blueBloom)"/>
    <rect width="680" height="180" fill="url(#microGrid)"/>
    <!-- animated light that occasionally sweeps through the drawing -->
    <rect class="scan" x="-200" y="0" width="200" height="180" fill="url(#scan)" transform="skewX(-18)"/>
    <!-- layered blueprint geography -->
    <path d="M12 148C110 131 190 173 295 149C388 128 444 140 535 119C591 106 630 118 680 101" stroke="#58A6FF" stroke-opacity=".12" stroke-width="1"/>
    <path d="M0 159C124 143 221 172 342 151C465 130 562 164 680 142" stroke="#79C0FF" stroke-opacity=".08" stroke-width="1"/>
    <path d="M31 89H644" stroke="#79C0FF" stroke-opacity=".14" stroke-dasharray="2 7"/>
    <path d="M620 21V151M540 40H663" stroke="#79C0FF" stroke-opacity=".1"/>
    <!-- Floating data sparks -->
    <g fill="#79C0FF">
      <circle class="particle-1" cx="475" cy="46" r="1.2"/>
      <circle class="particle-2" cx="647" cy="124" r="1"/>
      <circle class="particle-3" cx="520" cy="145" r="1.1"/>
      <circle class="particle-2" cx="661" cy="71" r=".7"/>
    </g>
    <!-- HUD / radar -->
    <g>
      <circle class="pulse" cx="586" cy="91" r="32" stroke="#58A6FF" stroke-opacity=".32"/>
      <circle class="pulse-delay" cx="586" cy="91" r="32" stroke="#58A6FF" stroke-opacity=".24"/>
      <circle cx="586" cy="91" r="45" stroke="#58A6FF" stroke-opacity=".16"/>
      <circle cx="586" cy="91" r="31" stroke="#79C0FF" stroke-opacity=".2"/>
