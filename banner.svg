<svg
  width="1200"
  height="1850"
  viewBox="0 0 1200 1850"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Harsha — Developer Profile</title>
  <desc id="desc">
    A terminal-and-git-log styled developer profile: identity, active builds,
    the build/break/rebuild loop, and open questions.
  </desc>

  <defs>

    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="1850" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#171A20"/>
      <stop offset="1" stop-color="#101318"/>
    </linearGradient>

    <radialGradient id="heroGlow" cx="0" cy="0" r="1"
      gradientTransform="translate(600 260) scale(560 340)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E8A33D" stop-opacity=".05"/>
      <stop offset="1" stop-color="#E8A33D" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r=".7" fill="#8B93A1" fill-opacity=".05"/>
    </pattern>

    <clipPath id="clip">
      <rect x="0" y="0" width="1200" height="1850" rx="18"/>
    </clipPath>

    <style>
      .mono { font-family: "JetBrains Mono","SFMono-Regular",Menlo,Consolas,monospace; }
      .sans { font-family: "Inter","Segoe UI",Helvetica,Arial,sans-serif; }

      .fadeIn { animation: fadeIn 1s ease-out .1s both; }
      .heroIn { animation: heroIn .9s cubic-bezier(.16,1,.3,1) .15s both; }
      .blink  { animation: blink 1.1s steps(1) infinite; }

      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes heroIn {
        from { transform: translateY(14px); opacity: 0; }
        to   { transform: translateY(0);    opacity: 1; }
      }
      @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }

      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
      }
    </style>

  </defs>

  <g clip-path="url(#clip)">

    <rect width="1200" height="1850" fill="url(#bg)"/>
    <rect width="1200" height="1850" fill="url(#dots)"/>
    <rect width="1200" height="1850" fill="url(#heroGlow)"/>

    <!-- outer frame -->
    <rect x="8" y="8" width="1184" height="1834" rx="14"
      stroke="#2A2E37" stroke-opacity=".6"/>

    <!-- ================= TOP BAR ================= -->
    <g class="fadeIn">
      <text x="64" y="47" fill="#EDEFF2" font-size="15" font-weight="700"
        letter-spacing=".2" class="mono">harsha<tspan fill="#E8A33D">@</tspan>katta</text>

      <text x="1136" y="47" text-anchor="end" fill="#E8A33D" font-size="12" class="mono">kattaharsha.dev</text>

      <line x1="64" y1="84" x2="1136" y2="84" stroke="#2A2E37" stroke-opacity=".7"/>
    </g>

    <!-- ================= HERO: TERMINAL ================= -->
    <g class="heroIn">

      <rect x="64" y="130" width="1072" height="316" rx="10"
        fill="#1C1F26" stroke="#2A2E37" stroke-width="1"/>

      <!-- titlebar -->
      <circle cx="90" cy="147" r="5" fill="#FF5F57"/>
      <circle cx="108" cy="147" r="5" fill="#FEBC2E"/>
      <circle cx="126" cy="147" r="5" fill="#28C840"/>
      <text x="600" y="151" text-anchor="middle" fill="#8B93A1" font-size="12" class="mono">
        harsha@kattaharsha — /home/harsha
      </text>
      <line x1="64" y1="164" x2="1136" y2="164" stroke="#2A2E37" stroke-opacity=".8"/>

      <!-- session -->
      <text x="96" y="200" font-size="16" class="mono">
        <tspan fill="#E8A33D">➜</tspan><tspan fill="#8B93A1"> ~ </tspan><tspan fill="#EDEFF2" font-weight="700">whoami</tspan>
      </text>
      <text x="96" y="232" font-size="15" fill="#8B93A1" class="mono">
        katta harsha vardhan — final-year aiml undergrad, systems tinkerer
      </text>

      <text x="96" y="280" font-size="16" class="mono">
        <tspan fill="#E8A33D">➜</tspan><tspan fill="#8B93A1"> ~ </tspan><tspan fill="#EDEFF2" font-weight="700">cat philosophy.txt</tspan>
      </text>
      <text x="96" y="312" font-size="15" fill="#8B93A1" class="mono">not a student who codes.</text>
      <text x="96" y="344" font-size="15" fill="#8B93A1" class="mono">a person who builds things to understand them,</text>
      <text x="96" y="376" font-size="15" fill="#8B93A1" class="mono">then breaks them to understand them better.</text>

      <text x="96" y="424" font-size="16" class="mono">
        <tspan fill="#E8A33D">➜</tspan><tspan fill="#8B93A1"> ~</tspan>
      </text>
      <rect class="blink" x="134" y="410" width="10" height="18" fill="#E8A33D"/>

    </g>

    <text x="64" y="478" fill="#8B93A1" font-size="13" letter-spacing=".3" class="mono">
      AIML UNDERGRAD <tspan fill="#4A5568"> · </tspan>BUILDER<tspan fill="#4A5568"> · </tspan>EXPERIMENTAL SYSTEMS
    </text>

    <line x1="64" y1="520" x2="1136" y2="520" stroke="#2A2E37" stroke-opacity=".5"/>

    <!-- ================= SECTION: ACTIVE BUILDS ================= -->
    <g class="fadeIn">

      <text x="64" y="566" fill="#E8A33D" font-size="12" letter-spacing=".3" class="mono">$ ls ./experiments -la</text>
      <text x="64" y="608" fill="#EDEFF2" font-size="30" font-weight="700" letter-spacing="-.3" class="sans">Active builds</text>
      <text x="64" y="636" fill="#8B93A1" font-size="14" class="sans">Small systems built to answer larger questions, not to pad a résumé.</text>

      <!-- row 1: TermNav -->
      <circle cx="70" cy="694" r="4" fill="#6FCB7F"/>
      <text x="92" y="700" fill="#EDEFF2" font-size="18" font-weight="700" class="mono">TermNav</text>
      <rect x="300" y="684" width="82" height="22" rx="11" fill="none" stroke="#6FCB7F" stroke-opacity=".6"/>
      <text x="341" y="699" text-anchor="middle" fill="#6FCB7F" font-size="10" letter-spacing=".5" class="mono">SHIPPED</text>
      <text x="412" y="700" fill="#8B93A1" font-size="13.5" class="sans">Keyboard-driven terminal navigation, published to npm — the first system that felt real.</text>
      <line x1="64" y1="728" x2="1136" y2="728" stroke="#2A2E37" stroke-opacity=".4"/>

      <!-- row 2: Doclayer -->
      <circle cx="70" cy="768" r="4" fill="#E8A33D"/>
      <text x="92" y="774" fill="#EDEFF2" font-size="18" font-weight="700" class="mono">Doclayer</text>
      <rect x="300" y="758" width="82" height="22" rx="11" fill="none" stroke="#E8A33D" stroke-opacity=".6"/>
      <text x="341" y="773" text-anchor="middle" fill="#E8A33D" font-size="10" letter-spacing=".5" class="mono">ACTIVE</text>
      <text x="412" y="774" fill="#8B93A1" font-size="13.5" class="sans">Word Automation System</text>
      <line x1="64" y1="802" x2="1136" y2="802" stroke="#2A2E37" stroke-opacity=".4"/>

      <!-- row 3: MorphStudio -->
      <circle cx="70" cy="842" r="4" fill="#E8A33D"/>
      <text x="92" y="848" fill="#EDEFF2" font-size="18" font-weight="700" class="mono">MorphStudio</text>
      <rect x="300" y="832" width="82" height="22" rx="11" fill="none" stroke="#E8A33D" stroke-opacity=".6"/>
      <text x="341" y="847" text-anchor="middle" fill="#E8A33D" font-size="10" letter-spacing=".5" class="mono">ACTIVE</text>
      <text x="412" y="848" fill="#8B93A1" font-size="13.5" class="sans">Graphics and vector work that outgrew a weekend curiosity.</text>
      <line x1="64" y1="876" x2="1136" y2="876" stroke="#2A2E37" stroke-opacity=".4"/>

      <!-- row 4: Nexis -->
      <circle cx="70" cy="916" r="4" fill="#4A5568"/>
      <text x="92" y="922" fill="#EDEFF2" font-size="18" font-weight="700" class="mono">Nexis</text>
      <rect x="300" y="906" width="82" height="22" rx="11" fill="none" stroke="#8B93A1" stroke-opacity=".5"/>
      <text x="341" y="921" text-anchor="middle" fill="#8B93A1" font-size="10" letter-spacing=".5" class="mono">WIP</text>
      <text x="412" y="922" fill="#8B93A1" font-size="13.5" class="sans">Distributed systems — because one machine was never enough.</text>
      <line x1="64" y1="950" x2="1136" y2="950" stroke="#2A2E37" stroke-opacity=".4"/>

      <!-- row 5: Orbit -->
      <circle cx="70" cy="990" r="4" fill="#4A5568"/>
      <text x="92" y="996" fill="#EDEFF2" font-size="18" font-weight="700" class="mono">Orbit</text>
      <rect x="300" y="980" width="82" height="22" rx="11" fill="none" stroke="#8B93A1" stroke-opacity=".5"/>
      <text x="341" y="995" text-anchor="middle" fill="#8B93A1" font-size="10" letter-spacing=".5" class="mono">ONGOING</text>
      <text x="412" y="996" fill="#8B93A1" font-size="13.5" class="sans">An operating system from scratch — probably never finished, always instructive.</text>

    </g>

    <line x1="64" y1="1046" x2="1136" y2="1046" stroke="#2A2E37" stroke-opacity=".5"/>

    <!-- ================= SECTION: THE LOOP ================= -->
    <g class="fadeIn">

      <text x="64" y="1090" fill="#E8A33D" font-size="12" letter-spacing=".3" class="mono">$ ./build.sh --loop</text>
      <text x="64" y="1132" fill="#EDEFF2" font-size="30" font-weight="700" letter-spacing="-.3" class="sans">How the loop actually runs</text>
      <text x="64" y="1160" fill="#8B93A1" font-size="14" class="sans">Five real stages, repeated until something works.</text>

      <line x1="90" y1="1220" x2="90" y2="1476" stroke="#2A2E37" stroke-opacity=".8" stroke-dasharray="2 6"/>

      <circle cx="90" cy="1226" r="6" fill="#1C1F26" stroke="#E8A33D" stroke-width="2"/>
      <text x="120" y="1224" fill="#E8A33D" font-size="14" font-weight="700" class="mono">01</text>
      <text x="152" y="1231" fill="#EDEFF2" font-size="16" class="sans">encounter something confusing</text>

      <circle cx="90" cy="1290" r="6" fill="#1C1F26" stroke="#E8A33D" stroke-width="2"/>
      <text x="120" y="1288" fill="#E8A33D" font-size="14" font-weight="700" class="mono">02</text>
      <text x="152" y="1295" fill="#EDEFF2" font-size="16" class="sans">build the smallest version</text>

      <circle cx="90" cy="1354" r="6" fill="#1C1F26" stroke="#E8A33D" stroke-width="2"/>
      <text x="120" y="1352" fill="#E8A33D" font-size="14" font-weight="700" class="mono">03</text>
      <text x="152" y="1359" fill="#EDEFF2" font-size="16" class="sans">break it on purpose</text>

      <circle cx="90" cy="1418" r="6" fill="#1C1F26" stroke="#E8A33D" stroke-width="2"/>
      <text x="120" y="1416" fill="#E8A33D" font-size="14" font-weight="700" class="mono">04</text>
      <text x="152" y="1423" fill="#EDEFF2" font-size="16" class="sans">understand the failure</text>

      <circle cx="90" cy="1482" r="6" fill="#1C1F26" stroke="#E8A33D" stroke-width="2"/>
      <text x="120" y="1480" fill="#E8A33D" font-size="14" font-weight="700" class="mono">05</text>
      <text x="152" y="1487" fill="#EDEFF2" font-size="16" class="sans">rebuild it properly</text>

      <text x="120" y="1522" fill="#8B93A1" font-size="13" letter-spacing=".2" class="mono">
        <tspan fill="#E8A33D">↻</tspan> loops back to 01 — next confusing thing
      </text>

    </g>

    <line x1="64" y1="1560" x2="1136" y2="1560" stroke="#2A2E37" stroke-opacity=".5"/>

    <!-- ================= SECTION: OPEN QUESTIONS ================= -->
    <g class="fadeIn">

      <text x="64" y="1604" fill="#E8A33D" font-size="12" letter-spacing=".3" class="mono">$ gh issue list --state open</text>
      <text x="64" y="1646" fill="#EDEFF2" font-size="30" font-weight="700" letter-spacing="-.3" class="sans">Open questions</text>

      <!-- card 1 -->
      <rect x="64" y="1682" width="341" height="100" rx="8" fill="#1C1F26" stroke="#2A2E37"/>
      <circle cx="88" cy="1710" r="4" fill="none" stroke="#6FCB7F" stroke-width="1.5"/>
      <text x="100" y="1714" fill="#6FCB7F" font-size="11" letter-spacing=".3" class="mono">#001 OPEN</text>
      <text x="86" y="1742" fill="#EDEFF2" font-size="13.5" class="sans">Where ML ends and</text>
      <text x="86" y="1762" fill="#EDEFF2" font-size="13.5" class="sans">systems engineering begins.</text>

      <!-- card 2 -->
      <rect x="429" y="1682" width="341" height="100" rx="8" fill="#1C1F26" stroke="#2A2E37"/>
      <circle cx="453" cy="1710" r="4" fill="none" stroke="#6FCB7F" stroke-width="1.5"/>
      <text x="465" y="1714" fill="#6FCB7F" font-size="11" letter-spacing=".3" class="mono">#002 OPEN</text>
      <text x="451" y="1742" fill="#EDEFF2" font-size="13.5" class="sans">How schedulers decide</text>
      <text x="451" y="1762" fill="#EDEFF2" font-size="13.5" class="sans">what deserves to run next.</text>

      <!-- card 3 -->
      <rect x="794" y="1682" width="341" height="100" rx="8" fill="#1C1F26" stroke="#2A2E37"/>
      <circle cx="818" cy="1710" r="4" fill="none" stroke="#6FCB7F" stroke-width="1.5"/>
      <text x="830" y="1714" fill="#6FCB7F" font-size="11" letter-spacing=".3" class="mono">#003 OPEN</text>
      <text x="816" y="1742" fill="#EDEFF2" font-size="13.5" class="sans">Why some abstractions hold</text>
      <text x="816" y="1762" fill="#EDEFF2" font-size="13.5" class="sans">while others leak immediately.</text>

    </g>

    <!-- ================= FOOTER ================= -->
    <text x="64" y="1822" fill="#4A5568" font-size="11" letter-spacing=".3" class="mono">
      coursework gathers dust · experiments do not.
    </text>
    <text x="1136" y="1822" text-anchor="end" fill="#4A5568" font-size="11" letter-spacing=".3" class="mono">build → break → understand</text>

  </g>

</svg>
