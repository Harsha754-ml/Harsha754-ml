<svg
  width="1200"
  height="1850"
  viewBox="0 0 1200 1850"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Harsha Vardhan Katta — Developer</title>
  <desc id="desc">
    Harsha Vardhan Katta — AI/ML undergraduate and builder.
    Active experiments, operating philosophy, and current technical questions.
  </desc>

  <defs>

    <!-- BACKGROUND -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1850" gradientUnits="userSpaceOnUse">
      <stop offset="0"  stop-color="#0A0E15"/>
      <stop offset=".5" stop-color="#0C1119"/>
      <stop offset="1"  stop-color="#080B11"/>
    </linearGradient>

    <radialGradient id="heroGlow" cx="0" cy="0" r="1"
      gradientTransform="translate(960 150) rotate(130) scale(560 400)"
      gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB" stop-opacity=".09"/>
      <stop offset=".55" stop-color="#2563EB" stop-opacity=".03"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" stroke="#5B8DEF" stroke-opacity=".02" stroke-width="1"/>
    </pattern>

    <!-- ACCENTS -->
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#4C9AFF"/>
      <stop offset="1" stop-color="#4C9AFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="monoTile" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1A2436"/>
      <stop offset="1" stop-color="#101724"/>
    </linearGradient>

    <linearGradient id="monoStroke" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#4C9AFF" stop-opacity=".6"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity=".2"/>
    </linearGradient>

    <linearGradient id="iconFill" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1E3A5F"/>
      <stop offset="1" stop-color="#14213A"/>
    </linearGradient>

    <clipPath id="clip">
      <rect width="1200" height="1850" rx="16"/>
    </clipPath>

  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="1850" fill="url(#bg)"/>
    <rect width="1200" height="1850" fill="url(#heroGlow)"/>
    <rect width="1200" height="1850" fill="url(#grid)"/>

    <!-- top accent hairline -->
    <rect x="64" y="0" width="1072" height="2" fill="url(#rule)" fill-opacity=".7"/>

    <!-- ============ TOP BAR ============ -->
    <rect x="64" y="34" width="26" height="26" rx="7" fill="url(#monoTile)" stroke="url(#monoStroke)"/>
    <text x="77" y="52" text-anchor="middle" fill="#7EB6FF" font-family="JetBrains Mono, Consolas, monospace" font-size="12" font-weight="700">H</text>

    <text x="104" y="52" fill="#8B98AC" font-family="JetBrains Mono, Consolas, monospace" font-size="12.5" letter-spacing="3">HARSHA KATTA / DEVELOPER</text>

    <circle cx="1058" cy="47" r="3.5" fill="#34D399"/>
    <text x="1070" y="52" fill="#7BA68E" font-family="JetBrains Mono, Consolas, monospace" font-size="12" letter-spacing="1">AVAILABLE</text>

    <line x1="64" y1="78" x2="1136" y2="78" stroke="#1C2534"/>

    <!-- ============ HERO ============ -->
    <!-- monogram tile -->
    <rect x="936" y="120" width="150" height="150" rx="22" fill="url(#monoTile)" stroke="url(#monoStroke)" stroke-width="1.5"/>
    <text x="1011" y="212" text-anchor="middle" fill="#DCE9FB" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="56" font-weight="800" letter-spacing="-2">HK</text>
    <rect x="966" y="238" width="90" height="3" rx="1.5" fill="url(#rule)"/>

    <text x="64" y="150" fill="#4C9AFF" font-family="JetBrains Mono, Consolas, monospace" font-size="13" letter-spacing="4">AI / ML ENGINEER</text>

    <text x="62" y="234" fill="#EDF2F8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="68" font-weight="800" letter-spacing="-2.5">Harsha Vardhan</text>
    <text x="62" y="306" fill="#EDF2F8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="68" font-weight="800" letter-spacing="-2.5">Katta</text>

    <!-- philosophy -->
    <text x="64" y="366" fill="#C4D1E0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="600">Not a student who codes.</text>
    <text x="64" y="398" fill="#8190A4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15.5">A builder who makes things to understand them,</text>
    <text x="64" y="422" fill="#8190A4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15.5">then breaks them to understand them better.</text>

    <!-- ============ FACT STRIP ============ -->
    <rect x="64" y="462" width="1072" height="56" rx="12" fill="#0F1521" stroke="#1C2534"/>

    <text x="92" y="486" fill="#5D6B80" font-family="JetBrains Mono, Consolas, monospace" font-size="11" letter-spacing="2">FOCUS</text>
    <text x="92" y="506" fill="#B7C3D4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600">Systems · ML infra · Dev tools</text>

    <line x1="404" y1="476" x2="404" y2="504" stroke="#1C2534"/>

    <text x="432" y="486" fill="#5D6B80" font-family="JetBrains Mono, Consolas, monospace" font-size="11" letter-spacing="2">BASE</text>
    <text x="432" y="506" fill="#B7C3D4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600">AI/ML Undergrad</text>

    <line x1="672" y1="476" x2="672" y2="504" stroke="#1C2534"/>

    <text x="700" y="486" fill="#5D6B80" font-family="JetBrains Mono, Consolas, monospace" font-size="11" letter-spacing="2">WEB</text>
    <text x="700" y="506" fill="#7EB6FF" font-family="JetBrains Mono, Consolas, monospace" font-size="13.5" font-weight="600">kattaharsha.dev</text>

    <line x1="940" y1="476" x2="940" y2="504" stroke="#1C2534"/>

    <text x="968" y="486" fill="#5D6B80" font-family="JetBrains Mono, Consolas, monospace" font-size="11" letter-spacing="2">GITHUB</text>
    <text x="968" y="506" fill="#7EB6FF" font-family="JetBrains Mono, Consolas, monospace" font-size="13.5" font-weight="600">@harshakatta</text>

    <!-- ============ SECTION 01 ============ -->
    <text x="64" y="596" fill="#4C9AFF" font-family="JetBrains Mono, Consolas, monospace" font-size="12" letter-spacing="4">01 / ACTIVE EXPERIMENTS</text>
    <text x="64" y="640" fill="#EDF2F8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="-0.5">What I'm currently building</text>
    <text x="64" y="668" fill="#5D6B80" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Small systems built to answer larger questions — not projects for the sake of having projects.</text>

    <!-- FEATURED: ORBIT -->
    <rect x="64" y="696" width="1072" height="116" rx="16" fill="#101826" stroke="#233047"/>
    <rect x="64" y="696" width="4" height="116" rx="2" fill="#4C9AFF" fill-opacity=".85"/>

    <rect x="92" y="722" width="64" height="64" rx="14" fill="url(#iconFill)" stroke="#2A3B57"/>
    <circle cx="124" cy="754" r="13" fill="none" stroke="#7EB6FF" stroke-width="2"/>
    <circle cx="124" cy="754" r="4" fill="#7EB6FF"/>
    <circle cx="137" cy="743" r="2.5" fill="#4C9AFF"/>

    <text x="176" y="740" fill="#EDF2F8" font-family="JetBrains Mono, Consolas, monospace" font-size="22" font-weight="700">Orbit</text>
    <text x="176" y="768" fill="#8190A4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14.5">An operating system built from scratch — kernel, drivers, and scheduler.</text>
    <text x="176" y="794" fill="#5D6B80" font-family="JetBrains Mono, Consolas, monospace" font-size="11.5" letter-spacing="0.5">C · MEMORY MANAGEMENT · PROCESS SCHEDULING</text>

    <rect x="1004" y="718" width="104" height="28" rx="14" fill="#2A2410" stroke="#5C4A1E" stroke-opacity=".6"/>
    <circle cx="1022" cy="732" r="3.5" fill="#FBBF24"/>
    <text x="1034" y="736" fill="#E4C774" font-family="JetBrains Mono, Consolas, monospace" font-size="11" letter-spacing="1.5">ONGOING</text>

    <text x="1108" y="794" text-anchor="end" fill="#4A586C" font-family="JetBrains Mono, Consolas, monospace" font-size="11" letter-spacing="1">FLAGSHIP</text>

    <!-- GRID (2 x 2) -->

    <!-- TermNav -->
    <rect x="64" y="836" width="520" height="128" rx="16" fill="#0F1521" stroke="#1C2534"/>
    <circle cx="92" cy="872" r="4.5" fill="#4C9AFF"/>
    <text x="110" y="877" fill="#EDF2F8" font-family="JetBrains Mono, Consolas, monospace" font-size="19" font-weight="700">TermNav</text>
    <rect x="468" y="858" width="92" height="26" rx="13" fill="#0E2B20" stroke="#1E4A36"/>
    <circle cx="486" cy="871" r="3" fill="#34D399"/>
    <text x="497" y="875" fill="#6EE7B7" font-family="JetBrains Mono, Consolas, monospace" font-size="10.5" letter-spacing="1">SHIPPED</text>
    <text x="110" y="912" fill="#8190A4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Keyboard-driven terminal navigation.</text>
    <text x="110" y="940" fill="#5D6B80" font-family="JetBrains Mono, Consolas, monospace" font-size="11" letter-spacing="0.5">NPM · CLI · FIRST SYSTEM THAT FELT REAL</text>

    <!-- SecureFile-X -->
    <rect x="616" y="836" width="520" height="128" rx="16" fill="#0F1521" stroke="#1C2534"/>
    <circle cx="644" cy="872" r="4.5" fill="#4C9AFF"/>
    <text x="662" y="877" fill="#EDF2F8" font-family="JetBrains Mono, Consolas, monospace" font-size="19" font-weight="700">SecureFile-X</text>
    <rect x="1020" y="858" width="92" height="26" rx="13" fill="#2A2410" stroke="#5C4A1E" stroke-opacity=".6"/>
    <circle cx="1038" cy="871" r="3" fill="#FBBF24"/>
    <text x="1049" y="875" fill="#E4C774" font-family="JetBrains Mono, Consolas, monospace" font-size="10.5" letter-spacing="1">ACTIVE</text>
    <text x="662" y="912" fill="#8190A4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">File and image encryption — distrust as a feature.</text>
    <text x="662" y="940" fill="#5D6B80" font-family="JetBrains Mono, Consolas, monospace" font-size="11" letter-spacing="0.5">CRYPTOGRAPHY · END-TO-END</text>

    <!-- Nexis -->
    <rect x="64" y="988" width="520" height="128" rx="16" fill="#0F1521" stroke="#1C2534"/>
    <circle cx="92" cy="1024" r="4.5" fill="#4C9AFF"/>
    <text x="110" y="1029" fill="#EDF2F8" font-family="JetBrains Mono, Consolas, monospace" font-size="19" font-weight="700">Nexis</text>
    <rect x="468" y="1010" width="92" height="26" rx="13" fill="#2A2410" stroke="#5C4A1E" stroke-opacity=".6"/>
    <circle cx="486" cy="1023" r="3" fill="#FBBF24"/>
    <text x="497" y="1027" fill="#E4C774" font-family="JetBrains Mono, Consolas, monospace" font-size="10.5" letter-spacing="1">WIP</text>
    <text x="110" y="1064" fill="#8190A4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Distributed systems — one machine wasn't enough.</text>
    <text x="110" y="1092" fill="#5D6B80" font-family="JetBrains Mono, Consolas, monospace" font-size="11" letter-spacing="0.5">CONSENSUS · REPLICATION · NETWORKING</text>

    <!-- MorphStudio -->
    <rect x="616" y="988" width="520" height="128" rx="16" fill="#0F1521" stroke="#1C2534"/>
    <circle cx="644" cy="1024" r="4.5" fill="#4C9AFF"/>
    <text x="662" y="1029" fill="#EDF2F8" font-family="JetBrains Mono, Consolas, monospace" font-size="19" font-weight="700">MorphStudio</text>
    <rect x="1020" y="1010" width="92" height="26" rx="13" fill="#101F38" stroke="#1E3A5F"/>
    <circle cx="1038" cy="1023" r="3" fill="#4C9AFF"/>
    <text x="1049" y="1027" fill="#7EB6FF" font-family="JetBrains Mono, Consolas, monospace" font-size="10.5" letter-spacing="1">EVOLVING</text>
    <text x="662" y="1064" fill="#8190A4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Graphics and vector work that outgrew a curiosity.</text>
    <text x="662" y="1092" fill="#5D6B80" font-family="JetBrains Mono, Consolas, monospace" font-size="11" letter-spacing="0.5">CANVAS · VECTOR PIPELINES</text>

    <!-- separator -->
    <line x1="64" y1="1160" x2="1136" y2="1160" stroke="#1C2534"/>

    <!-- ============ SECTION 02 — OPERATING LOOP ============ -->
    <text x="64" y="1222" fill="#4C9AFF" font-family="JetBrains Mono, Consolas, monospace" font-size="12" letter-spacing="4">02 / OPERATING LOOP</text>
    <text x="64" y="1266" fill="#EDF2F8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="-0.5">How the work actually happens</text>

    <!-- vertical rail -->
    <line x1="124" y1="1316" x2="124" y2="1568" stroke="#233047" stroke-width="2"/>

    <circle cx="124" cy="1316" r="15" fill="#0F1521" stroke="#4C9AFF" stroke-width="1.5"/>
    <text x="124" y="1321" text-anchor="middle" fill="#7EB6FF" font-family="JetBrains Mono, Consolas, monospace" font-size="12" font-weight="700">1</text>
    <text x="164" y="1322" fill="#C4D1E0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16.5" font-weight="600">Encounter something confusing</text>

    <circle cx="124" cy="1379" r="15" fill="#0F1521" stroke="#4C9AFF" stroke-width="1.5"/>
    <text x="124" y="1384" text-anchor="middle" fill="#7EB6FF" font-family="JetBrains Mono, Consolas, monospace" font-size="12" font-weight="700">2</text>
    <text x="164" y="1385" fill="#C4D1E0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16.5" font-weight="600">Build the smallest version</text>

    <circle cx="124" cy="1442" r="15" fill="#0F1521" stroke="#4C9AFF" stroke-width="1.5"/>
    <text x="124" y="1447" text-anchor="middle" fill="#7EB6FF" font-family="JetBrains Mono, Consolas, monospace" font-size="12" font-weight="700">3</text>
    <text x="164" y="1448" fill="#C4D1E0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16.5" font-weight="600">Break it on purpose</text>

    <circle cx="124" cy="1505" r="15" fill="#0F1521" stroke="#4C9AFF" stroke-width="1.5"/>
    <text x="124" y="1510" text-anchor="middle" fill="#7EB6FF" font-family="JetBrains Mono, Consolas, monospace" font-size="12" font-weight="700">4</text>
    <text x="164" y="1511" fill="#C4D1E0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16.5" font-weight="600">Understand the failure</text>

    <circle cx="124" cy="1568" r="15" fill="#0F1521" stroke="#4C9AFF" stroke-width="1.5"/>
    <text x="124" y="1573" text-anchor="middle" fill="#7EB6FF" font-family="JetBrains Mono, Consolas, monospace" font-size="12" font-weight="700">5</text>
    <text x="164" y="1574" fill="#C4D1E0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16.5" font-weight="600">Rebuild it properly</text>

    <path d="M124 1590 C124 1616 180 1616 236 1616" stroke="#4C9AFF" stroke-opacity=".5" stroke-dasharray="2 6" fill="none"/>
    <text x="252" y="1621" fill="#4C9AFF" font-family="JetBrains Mono, Consolas, monospace" font-size="12.5" letter-spacing="1.5">→ repeat with the next confusing thing</text>

    <!-- separator -->
    <line x1="64" y1="1662" x2="1136" y2="1662" stroke="#1C2534"/>

    <!-- ============ SECTION 03 — CURRENT QUESTIONS ============ -->
    <text x="64" y="1716" fill="#4C9AFF" font-family="JetBrains Mono, Consolas, monospace" font-size="12" letter-spacing="4">03 / CURRENT QUESTIONS</text>

    <rect x="64" y="1740" width="344" height="72" rx="14" fill="#0F1521" stroke="#1C2534"/>
    <rect x="64" y="1740" width="3" height="72" rx="1.5" fill="#4C9AFF" fill-opacity=".7"/>
    <text x="86" y="1768" fill="#7EB6FF" font-family="JetBrains Mono, Consolas, monospace" font-size="11" letter-spacing="2">Q · 01</text>
    <text x="86" y="1792" fill="#B7C3D4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13.5">Where ML ends and systems engineering begins.</text>

    <rect x="428" y="1740" width="344" height="72" rx="14" fill="#0F1521" stroke="#1C2534"/>
    <rect x="428" y="1740" width="3" height="72" rx="1.5" fill="#4C9AFF" fill-opacity=".7"/>
    <text x="450" y="1768" fill="#7EB6FF" font-family="JetBrains Mono, Consolas, monospace" font-size="11" letter-spacing="2">Q · 02</text>
    <text x="450" y="1792" fill="#B7C3D4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13.5">How schedulers decide what runs next.</text>

    <rect x="792" y="1740" width="344" height="72" rx="14" fill="#0F1521" stroke="#1C2534"/>
    <rect x="792" y="1740" width="3" height="72" rx="1.5" fill="#4C9AFF" fill-opacity=".7"/>
    <text x="814" y="1768" fill="#7EB6FF" font-family="JetBrains Mono, Consolas, monospace" font-size="11" letter-spacing="2">Q · 03</text>
    <text x="814" y="1792" fill="#B7C3D4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13.5">Why some abstractions hold and others leak.</text>

    <!-- bottom accent hairline -->
    <rect x="64" y="1846" width="1072" height="2" fill="url(#rule)" fill-opacity=".35"/>
  </g>
</svg>
