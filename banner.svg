<svg width="680" height="180" viewBox="0 0 680 180" xmlns="http://www.w3.org/2000/svg">

<defs>

  <!-- Background -->
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0d1117"/>
    <stop offset="100%" stop-color="#090c11"/>
  </linearGradient>

  <!-- Accent -->
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#58a6ff"/>
    <stop offset="100%" stop-color="#79c0ff"/>
  </linearGradient>

  <!-- Glow -->
  <filter id="glow">
    <feGaussianBlur stdDeviation="3" result="colored"/>
    <feMerge>
      <feMergeNode in="colored"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <!-- Text Shadow -->
  <filter id="shadow">
    <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.6"/>
  </filter>

  <!-- Noise -->
  <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#58a6ff" opacity="0.08"/>
  </pattern>

</defs>

<!-- Background -->
<rect width="680" height="180" rx="10" fill="url(#bg)"/>

<!-- Dot texture -->
<rect width="680" height="180" fill="url(#dots)"/>

<!-- Outer Border -->
<rect x="0.5" y="0.5" width="679" height="179"
rx="10"
fill="none"
stroke="#30363d"/>

<!-- Accent Strip -->
<rect width="4" height="180" fill="url(#accent)"/>

<!-- Secondary Accent -->
<rect x="9" width="1.5" height="180"
fill="#58a6ff"
opacity=".25"/>

<!-- Decorative Blueprint Lines -->
<line x1="30" y1="88" x2="640" y2="88"
stroke="#58a6ff"
opacity=".18"/>

<line x1="620" y1="20" x2="620" y2="150"
stroke="#58a6ff"
opacity=".08"/>

<line x1="540" y1="40" x2="660" y2="40"
stroke="#58a6ff"
opacity=".08"/>

<!-- Corner Decoration -->
<path d="M655 10h15v15"
stroke="#58a6ff"
stroke-width="1"
fill="none"
opacity=".4"/>

<!-- Circular HUD -->
<circle cx="585" cy="90"
r="42"
fill="none"
stroke="#58a6ff"
opacity=".12"/>

<circle cx="585" cy="90"
r="30"
fill="none"
stroke="#58a6ff"
opacity=".10"/>

<line x1="543" y1="90"
x2="627" y2="90"
stroke="#58a6ff"
opacity=".10"/>

<line x1="585" y1="48"
x2="585" y2="132"
stroke="#58a6ff"
opacity=".10"/>

<!-- Small HUD Cross -->
<circle cx="585" cy="90" r="2" fill="#58a6ff"/>

<!-- Header -->
<text
x="34"
y="60"
font-family="'Courier New',monospace"
font-size="11"
letter-spacing="4"
fill="#58a6ff"
opacity=".75">

FIELD NOTES / ACTIVE

</text>

<!-- Main Title -->
<text
x="34"
y="118"
font-family="Georgia,serif"
font-size="58"
font-weight="700"
fill="#f0f6fc"
filter="url(#shadow)">

Harsha

</text>

<!-- Subtitle -->
<text
x="36"
y="150"
font-family="'Courier New',monospace"
font-size="12"
letter-spacing="1"
fill="#8b949e">

builder • experimenter • occasionally right

</text>

<!-- Left Marker -->
<rect
x="32"
y="70"
width="6"
height="6"
rx="3"
fill="#58a6ff"
filter="url(#glow)"/>

<!-- Tiny Decorative Numbers -->
<text
x="560"
y="58"
font-family="'Courier New',monospace"
font-size="9"
fill="#58a6ff"
opacity=".35">

SYS-001

</text>

<text
x="560"
y="70"
font-family="'Courier New',monospace"
font-size="9"
fill="#58a6ff"
opacity=".35">

STATUS: ACTIVE

</text>

<!-- Bottom Wave -->
<path
d="M0 160
Q120 145 240 160
T480 160
T680 160"
fill="none"
stroke="#58a6ff"
opacity=".08"/>

<!-- Version -->
<text
x="646"
y="166"
text-anchor="end"
font-family="'Courier New',monospace"
font-size="10"
fill="#484f58">

v∞.ongoing

</text>

</svg>
